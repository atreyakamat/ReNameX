services:
  renamex:
    build: .
    image: renamex:latest
    container_name: renamex
    ports:
      - "3000:8080"
    restart: unless-stopped
    environment:
      # Pages allowed to show ReNameX in a frame: itself and the House of Stix control room.
      FRAME_ANCESTORS: "'self' ${CONTROL_ROOM_ORIGIN:-http://localhost:8200}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
